<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OSM OAuth</title>
  </head>
  <body>
    <script>
      if (new URLSearchParams(location.search).has('code')) {
        if (window.opener) {
          new BroadcastChannel('osm-api-auth-complete').postMessage(location.href)
          window.close()
        } else {
          const appUrl = new URL('..', location.href)
          appUrl.search = location.search
          location.replace(appUrl.href)
        }
      }
    </script>
  </body>
</html>
