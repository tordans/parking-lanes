name: Mode feedback
description: Report unexpected behaviour or suggest improvements for a Street Space Editor mode.
title: '[Feedback]: '
labels: ['feedback']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying Street Space Editor. Modes are at different maturity levels (alpha, beta, experimental) — your feedback helps shape the UI and editing flows.

        **Please include screenshots or a short screen recording whenever you can.** They make bugs and UX issues much easier to understand. After you submit this form, drag and drop images into a follow-up comment, or paste with Ctrl/Cmd+V.
  - type: input
    id: mode
    attributes:
      label: Mode
      description: Which editor mode were you using?
      placeholder: Parking, Width, Lanes, …
    validations:
      required: true
  - type: input
    id: example-url
    attributes:
      label: Example URL
      description: Link to the map view that shows the issue (copy from the browser address bar).
      placeholder: https://…
    validations:
      required: true
  - type: textarea
    id: current-behaviour
    attributes:
      label: Current behaviour and UI
      description: What happens today? Describe the steps and what you see. Mention if you attached screenshots in a comment.
      placeholder: …
    validations:
      required: true
  - type: textarea
    id: target-behaviour
    attributes:
      label: Target behaviour and UI
      description: What did you expect or want instead?
      placeholder: …
    validations:
      required: true
